<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Replay</title>
<style>
  :root{
    --wa-header:#075E54;
    --wa-header-2:#128C7E;
    --wa-bg:#E4DDD4;
    --sent-bg:#DCF8C6;
    --received-bg:#FFFFFF;
    --tick-blue:#34B7F1;
    --panel:#1f2c33;
    --panel-2:#2a3942;
    --accent:#25D366;
    --text-dim:#8696a0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:#0b141a;
    color:#e9edef;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:18px 12px 40px;
  }
  h1{font-size:16px;font-weight:600;margin:0 0 14px;color:#e9edef;letter-spacing:.2px;display:flex;align-items:center;gap:8px;}
  h1 .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);}

  .layout{
    width:100%;
    max-width:920px;
    display:flex;
    gap:20px;
    align-items:flex-start;
    flex-wrap:wrap;
    justify-content:center;
  }

  /* ---------- Control Panel ---------- */
  .panel{
    background:var(--panel);
    border-radius:14px;
    padding:16px;
    width:100%;
    max-width:300px;
    flex-shrink:0;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  .panel h2{
    font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);
    margin:0 0 8px;font-weight:600;
  }
  .panel section{margin-bottom:16px;}
  .panel section:last-child{margin-bottom:0;}

  .file-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    background:var(--panel-2);border:1px dashed #3b4a54;border-radius:10px;
    padding:12px;cursor:pointer;font-size:13px;color:#e9edef;transition:.15s;
  }
  .file-btn:hover{background:#33454e;border-color:var(--accent);}
  #fileInput{display:none;}
  .filename{font-size:11px;color:var(--text-dim);margin-top:6px;word-break:break-all;}

  select{
    width:100%;background:var(--panel-2);color:#e9edef;border:1px solid #3b4a54;
    border-radius:8px;padding:9px 10px;font-size:13px;outline:none;
  }

  .chip-row{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{
    background:var(--panel-2);border:1px solid #3b4a54;color:#e9edef;
    padding:6px 11px;border-radius:20px;font-size:12.5px;cursor:pointer;transition:.15s;
  }
  .chip:hover{border-color:var(--accent);}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#06301c;font-weight:600;}

  .slider-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .slider-row input[type=range]{flex:1;accent-color:var(--accent);}
  .slider-val{font-size:12px;color:var(--text-dim);min-width:38px;text-align:right;}

  .btn-row{display:flex;gap:8px;}
  .btn{
    flex:1;background:var(--accent);border:none;color:#06301c;font-weight:700;
    padding:10px 8px;border-radius:10px;cursor:pointer;font-size:13px;transition:.15s;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn.secondary{background:var(--panel-2);color:#e9edef;border:1px solid #3b4a54;font-weight:600;}
  .btn.secondary:hover{border-color:var(--accent);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;font-size:13px;}
  .switch{position:relative;width:38px;height:21px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .slider-tog{position:absolute;cursor:pointer;inset:0;background:#3b4a54;border-radius:20px;transition:.2s;}
  .slider-tog:before{content:"";position:absolute;height:15px;width:15px;left:3px;top:3px;background:white;border-radius:50%;transition:.2s;}
  input:checked + .slider-tog{background:var(--accent);}
  input:checked + .slider-tog:before{transform:translateX(17px);}

  .progress-wrap{background:var(--panel-2);border-radius:8px;height:6px;overflow:hidden;margin-top:10px;}
  .progress-bar{height:100%;background:var(--accent);width:0%;transition:width .2s;}
  .progress-label{font-size:11px;color:var(--text-dim);margin-top:6px;text-align:center;}

  /* ---------- Phone ---------- */
  .phone-outer{flex-shrink:0;}
  .phone{
    width:360px;
    height:700px;
    background:var(--wa-bg);
    border-radius:32px;
    overflow:hidden;
    position:relative;
    box-shadow:0 20px 60px rgba(0,0,0,.55), 0 0 0 8px #111b21, 0 0 0 9px #2a3942;
    display:flex;
    flex-direction:column;
  }
  .statusbar{
    background:var(--wa-header);
    color:white;font-size:12px;
    padding:7px 18px 2px;
    display:flex;justify-content:space-between;
  }
  .chat-header{
    background:var(--wa-header);
    color:white;padding:8px 12px 12px;
    display:flex;align-items:center;gap:10px;
  }
  .back-arrow{font-size:20px;opacity:.9;}
  .avatar{
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-weight:600;font-size:14px;color:white;flex-shrink:0;
  }
  .header-text{flex:1;min-width:0;}
  .header-name{font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .header-status{font-size:12px;color:#d5e8e5;height:15px;}
  .header-icons{display:flex;gap:16px;font-size:16px;opacity:.95;}

  .chat-body{
    flex:1;overflow-y:auto;
    padding:10px 6px;
    display:flex;flex-direction:column;
    background-color:var(--wa-bg);
    background-image:
      radial-gradient(circle at 25% 20%, rgba(0,0,0,0.025) 0, transparent 40%),
      radial-gradient(circle at 75% 60%, rgba(0,0,0,0.025) 0, transparent 40%),
      radial-gradient(circle at 40% 80%, rgba(0,0,0,0.02) 0, transparent 35%);
  }
  .chat-body::-webkit-scrollbar{width:5px;}
  .chat-body::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:4px;}

  .row{display:flex;width:100%;margin:1.5px 0;}
  .row.received{justify-content:flex-start;}
  .row.sent{justify-content:flex-end;}

  .bubble{
    max-width:76%;
    padding:6px 9px 7px 9px;
    border-radius:8px;
    font-size:14px;
    line-height:19px;
    position:relative;
    box-shadow:0 1px 1px rgba(0,0,0,.13);
    word-wrap:break-word;
    white-space:pre-wrap;
    animation:pop .22s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes pop{from{opacity:0;transform:scale(.8) translateY(4px);}to{opacity:1;transform:scale(1) translateY(0);}}
  .bubble.received{background:var(--received-bg);border-top-left-radius:0;color:#111b21;}
  .bubble.sent{background:var(--sent-bg);border-top-right-radius:0;color:#111b21;}
  .bubble a{color:#039be5;text-decoration:none;}
  .bubble a:hover{text-decoration:underline;}
  .bubble .edited-tag{font-size:11px;color:#667781;margin-left:4px;}

  .meta-row{display:flex;justify-content:flex-end;align-items:center;gap:3px;margin-top:2px;float:right;margin-left:8px;}
  .meta-time{font-size:11px;color:#667781;}
  .ticks{display:flex;}

  .media-box{
    display:flex;align-items:center;gap:8px;
    background:rgba(0,0,0,.04);border-radius:6px;padding:8px 10px;
    font-size:13px;color:#3b4a54;min-width:120px;
  }
  .media-icon{font-size:18px;}
  .deleted-text{font-style:italic;color:#667781;font-size:13.5px;display:flex;align-items:center;gap:5px;}

  .day-divider{
    align-self:center;background:#E1F2FB;color:#54656f;
    font-size:12.3px;padding:5px 12px;border-radius:8px;
    margin:10px 0;box-shadow:0 1px 1px rgba(0,0,0,.08);
  }
  .system-bubble{
    align-self:center;background:#FEF7CD;color:#54656f;
    font-size:12px;padding:6px 12px;border-radius:8px;
    margin:8px 30px;text-align:center;box-shadow:0 1px 1px rgba(0,0,0,.08);
  }

  .typing-row{display:flex;justify-content:flex-start;margin:1.5px 0;}
  .typing-bubble{
    background:var(--received-bg);border-top-left-radius:0;border-radius:8px;
    padding:9px 14px;display:flex;gap:4px;align-items:center;
    box-shadow:0 1px 1px rgba(0,0,0,.13);
  }
  .typing-bubble .dot{width:6.5px;height:6.5px;border-radius:50%;background:#93999e;animation:blink 1.3s infinite;}
  .typing-bubble .dot:nth-child(2){animation-delay:.18s;}
  .typing-bubble .dot:nth-child(3){animation-delay:.36s;}
  @keyframes blink{0%,60%,100%{opacity:.25;transform:scale(.85);}30%{opacity:1;transform:scale(1);}}

  .input-bar{
    background:#f0f0f0;padding:8px 10px;display:flex;align-items:center;gap:8px;
  }
  .input-pill{
    flex:1;background:white;border-radius:22px;padding:9px 14px;font-size:14px;color:#8696a0;
  }
  .mic-circle{
    width:38px;height:38px;border-radius:50%;background:var(--wa-header);
    display:flex;align-items:center;justify-content:center;color:white;font-size:16px;flex-shrink:0;
  }

  .empty-state{
    flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;
    color:#7d8b93;padding:30px;text-align:center;gap:10px;
  }
  .empty-state .big{font-size:38px;}

  @media (max-width:760px){
    .phone{width:100%;max-width:360px;}
  }
</style>
</head>
<body>

<h1><span class="dot"></span>Chat Replay Studio</h1>

<div class="layout">

  <!-- CONTROL PANEL -->
  <div class="panel">
    <section>
      <h2>Chat File</h2>
      <label class="file-btn" for="fileInput">📄 Upload WhatsApp .txt export</label>
      <input type="file" id="fileInput" accept=".txt">
      <div class="filename" id="fileName">Using: WhatsApp_Chat_with_Sonia_Bhabhi.txt (demo)</div>
    </section>

    <section>
      <h2>You are</h2>
      <select id="meSelect"></select>
    </section>

    <section>
      <h2>Playback speed</h2>
      <div class="chip-row" id="speedChips">
        <div class="chip" data-mode="real">Real time</div>
        <div class="chip" data-mode="fixed" data-val="2">2s</div>
        <div class="chip" data-mode="fixed" data-val="5">5s</div>
        <div class="chip" data-mode="fixed" data-val="6">6s</div>
        <div class="chip active" data-mode="fixed" data-val="3">3s</div>
        <div class="chip" data-mode="fixed" data-val="10">10s</div>
      </div>
      <div class="slider-row">
        <input type="range" id="customSlider" min="0.3" max="15" step="0.1" value="3">
        <span class="slider-val" id="customVal">3.0s</span>
      </div>
    </section>

    <section>
      <div class="toggle-row">
        <span>🔊 Sound effects</span>
        <label class="switch">
          <input type="checkbox" id="soundToggle" checked>
          <span class="slider-tog"></span>
        </label>
      </div>
    </section>

    <section>
      <div class="btn-row">
        <button class="btn" id="playBtn">▶ Play</button>
        <button class="btn secondary" id="restartBtn">⟲ Restart</button>
      </div>
      <div class="btn-row" style="margin-top:8px;">
        <button class="btn secondary" id="skipBtn">⏭ Show all instantly</button>
      </div>
      <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
      <div class="progress-label" id="progressLabel">0 / 0 messages</div>
    </section>
  </div>

  <!-- PHONE -->
  <div class="phone-outer">
    <div class="phone">
      <div class="statusbar">
        <span id="clock">9:41</span>
        <span>🔋📶</span>
      </div>
      <div class="chat-header">
        <span class="back-arrow">←</span>
        <div class="avatar" id="avatar">?</div>
        <div class="header-text">
          <div class="header-name" id="headerName">Contact</div>
          <div class="header-status" id="headerStatus">online</div>
        </div>
        <div class="header-icons"><span>📹</span><span>📞</span><span>⋮</span></div>
      </div>
      <div class="chat-body" id="chatBody">
        <div class="empty-state" id="emptyState">
          <div class="big">💬</div>
          <div>Press Play to start the replay</div>
        </div>
      </div>
      <div class="input-bar">
        <div class="input-pill">Message</div>
        <div class="mic-circle">🎤</div>
      </div>
    </div>
  </div>

</div>

<script id="embeddedChat" type="application/json">__EMBEDDED_CHAT_JSON__</script>

<script>
(function(){

  /* ================= PARSER ================= */
  function parseDateTime(dateStr, timeStr){
    let [m,d,y] = dateStr.split('/').map(Number);
    if (y < 100) y += 2000;
    const hasAmPm = /[ap]m/i.test(timeStr);
    let clean = timeStr.replace(/\s?[apAP][mM]/,'').trim();
    let [hh,mm] = clean.split(':').map(Number);
    if (hasAmPm){
      const isPM = /pm/i.test(timeStr);
      if (isPM && hh !== 12) hh += 12;
      if (!isPM && hh === 12) hh = 0;
    }
    return new Date(y, m-1, d, hh, mm);
  }

  function parseChat(raw){
    const lineStart = /^(\d{1,2}\/\d{1,2}\/\d{2,4}),\s(\d{1,2}:\d{2}(?:\s?[APap][Mm])?)\s-\s(.+)$/;
    const senderSplit = /^([^:]{1,35}?):\s([\s\S]*)$/;
    const lines = raw.split(/\r?\n/);
    const messages = [];
    for (let line of lines){
      line = line.replace(/^[\u200e\u200f]/,'');
      const m = line.match(lineStart);
      if (m){
        const [, dateStr, timeStr, rest] = m;
        const sm = rest.match(senderSplit);
        let sender = null, content = rest, type = 'system';
        if (sm){ sender = sm[1].trim(); content = sm[2]; type = 'text'; }
        messages.push({ date: dateStr, time: timeStr, ts: parseDateTime(dateStr,timeStr), sender, type, text: content });
      } else if (messages.length && line.trim() !== ''){
        messages[messages.length-1].text += '\n' + line;
      }
    }
    for (const msg of messages){
      if (msg.type !== 'text') continue;
      const t = msg.text.trim();
      if (t === '<Media omitted>') msg.type = 'media';
      else if (t === '') msg.type = 'sticker';
      else if (/^You deleted this message$/.test(t) || /This message was deleted/i.test(t)) msg.type = 'deleted';
      else if (/\.vcf \(file attached\)$/.test(t)) { msg.type = 'contact'; msg.contactName = t.replace(/\.vcf \(file attached\)$/,'').trim(); }
      else if (/<This message was edited>$/.test(t)) { msg.edited = true; msg.text = t.replace(/\s*<This message was edited>$/,''); }
    }
    const participants = [...new Set(messages.filter(x=>x.sender).map(x=>x.sender))];
    return { messages, participants };
  }

  /* ================= STATE ================= */
  let chatData = { messages: [], participants: [] };
  let meName = null;
  let idx = 0;
  let playing = false;
  let stopRequested = false;
  let speedMode = 'fixed';
  let fixedSeconds = 3;
  let pendingSentTicks = [];

  const AVATAR_COLORS = ['#7C4DFF','#00BFA5','#FF7043','#5C6BC0','#26A69A','#EC407A','#7E57C2','#42A5F5','#FFA726','#8D6E63'];
  function colorFor(name){
    let h = 0; for (let i=0;i<name.length;i++) h = name.charCodeAt(i) + ((h<<5)-h);
    return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length];
  }
  function initials(name){
    return name.split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
  }

  /* ================= AUDIO ================= */
  let actx = null;
  function ensureAudio(){ if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); if (actx.state==='suspended') actx.resume(); }
  function soundOn(){ return document.getElementById('soundToggle').checked; }
  function beep(freqStart, freqEnd, dur, type, vol){
    if (!soundOn()) return;
    ensureAudio();
    const t0 = actx.currentTime;
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freqStart, t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,20), t0+dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol||0.15, t0+0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(gain); gain.connect(actx.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }
  function playReceiveSound(){ beep(600,900,0.16,'sine',0.14); setTimeout(()=>beep(900,1200,0.12,'sine',0.1),70); }
  function playSendSound(){ beep(500,320,0.11,'sine',0.09); }
  function playTypingTick(){ beep(320+Math.random()*60,280,0.045,'square',0.02); }

  /* ================= RENDER HELPERS ================= */
  const chatBody = document.getElementById('chatBody');
  const emptyState = document.getElementById('emptyState');

  function scrollToBottom(){ chatBody.scrollTop = chatBody.scrollHeight; }

  function fmtTime(ts){
    let h = ts.getHours(), m = ts.getMinutes();
    const ap = h>=12?'PM':'AM';
    h = h%12; if (h===0) h=12;
    return h+':'+String(m).padStart(2,'0')+' '+ap;
  }
  function fmtDay(ts){
    const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
    return days[ts.getDay()]+' — '+ts.getDate()+' '+months[ts.getMonth()]+' '+ts.getFullYear();
  }
  function linkify(text){
    const esc = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return esc.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  }
  function ticksSVG(state){
    // state: 'sent' (1 grey), 'delivered' (2 grey), 'read' (2 blue)
    const color = state==='read' ? 'var(--tick-blue)' : '#8696a0';
    if (state==='sent'){
      return '<svg width="14" height="10" viewBox="0 0 16 11"><path fill="'+color+'" d="M11.1 0.4 4.9 6.6 2.9 4.6 1.5 6 4.9 9.4 12.5 1.8z"/></svg>';
    }
    return '<svg width="18" height="10" viewBox="0 0 20 11"><path fill="'+color+'" d="M6.1 0.4 -0.1 6.6 -2.1 4.6 -3.5 6 -0.1 9.4 7.5 1.8z" transform="translate(4,0)"/><path fill="'+color+'" d="M13.1 0.4 6.9 6.6 4.9 4.6 3.5 6 6.9 9.4 14.5 1.8z"/></svg>';
  }

  let lastDateKey = null;

  function appendDayDivider(ts){
    const key = ts.toDateString();
    if (key === lastDateKey) return;
    lastDateKey = key;
    const div = document.createElement('div');
    div.className = 'day-divider';
    div.textContent = fmtDay(ts);
    chatBody.appendChild(div);
  }

  function appendSystem(msg){
    const div = document.createElement('div');
    div.className = 'system-bubble';
    div.textContent = '🔒 ' + msg.text.replace(/\*Learn more\*/,'').trim();
    chatBody.appendChild(div);
  }

  function bubbleInnerHTML(msg){
    if (msg.type === 'media'){
      return '<div class="media-box"><span class="media-icon">📷</span><span>Photo/Video</span></div>';
    }
    if (msg.type === 'sticker'){
      return '<div class="media-box"><span class="media-icon">😊</span><span>Sticker</span></div>';
    }
    if (msg.type === 'contact'){
      return '<div class="media-box"><span class="media-icon">👤</span><span>Contact: '+ (msg.contactName||'card') +'</span></div>';
    }
    if (msg.type === 'deleted'){
      return '<div class="deleted-text">🚫 This message was deleted</div>';
    }
    return linkify(msg.text) + (msg.edited ? '<span class="edited-tag">(edited)</span>' : '');
  }

  function appendMessage(msg){
    const isMe = msg.sender === meName;
    const row = document.createElement('div');
    row.className = 'row ' + (isMe ? 'sent' : 'received');
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (isMe ? 'sent' : 'received');
    bubble.innerHTML = bubbleInnerHTML(msg);

    const meta = document.createElement('span');
    meta.className = 'meta-row';
    let metaHTML = '<span class="meta-time">'+fmtTime(msg.ts)+'</span>';
    let tickEl = null;
    if (isMe){
      metaHTML += '<span class="ticks" data-state="sent">'+ticksSVG('sent')+'</span>';
    }
    meta.innerHTML = metaHTML;
    bubble.appendChild(meta);
    row.appendChild(bubble);
    chatBody.appendChild(row);
    scrollToBottom();

    if (isMe){
      const ticksSpan = meta.querySelector('.ticks');
      pendingSentTicks.push(ticksSpan);
      setTimeout(()=>{ if (ticksSpan) ticksSpan.innerHTML = ticksSVG('delivered'); ticksSpan && ticksSpan.setAttribute('data-state','delivered'); }, 650);
      playSendSound();
    } else {
      playReceiveSound();
    }
  }

  function markPendingAsRead(){
    pendingSentTicks.forEach(el=>{ if (el){ el.innerHTML = ticksSVG('read'); el.setAttribute('data-state','read'); } });
    pendingSentTicks = [];
  }

  let typingInterval = null;
  function showTyping(){
    document.getElementById('headerStatus').textContent = 'typing...';
    const row = document.createElement('div');
    row.className = 'typing-row';
    row.id = 'typingRow';
    row.innerHTML = '<div class="typing-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
    chatBody.appendChild(row);
    scrollToBottom();
    playTypingTick();
    typingInterval = setInterval(playTypingTick, 260);
  }
  function hideTyping(){
    document.getElementById('headerStatus').textContent = 'online';
    const row = document.getElementById('typingRow');
    if (row) row.remove();
    if (typingInterval){ clearInterval(typingInterval); typingInterval = null; }
  }

  /* ================= PLAYBACK ENGINE ================= */
  function sleep(ms){
    return new Promise(resolve=>{
      const start = performance.now();
      (function check(){
        if (stopRequested){ resolve(); return; }
        if (!playing){ requestAnimationFrame(check); return; }
        if (performance.now() - start >= ms){ resolve(); } else { requestAnimationFrame(check); }
      })();
    });
  }

  function computeDelay(prev, cur){
    if (speedMode === 'real'){
      if (!prev) return 0.4;
      let delta = (cur.ts - prev.ts)/1000;
      if (delta < 0) delta = 1;
      return Math.min(Math.max(delta, 0.5), 12);
    }
    return fixedSeconds;
  }

  async function playLoop(){
    stopRequested = false;
    const msgs = chatData.messages;
    while (idx < msgs.length){
      if (stopRequested) return;
      const msg = msgs[idx];
      const prev = idx>0 ? msgs[idx-1] : null;
      const delay = computeDelay(prev, msg);

      if (msg.type !== 'system' && msg.sender !== meName){
        // typing pause before a received message
        markPendingAsRead();
        await sleep(Math.min(delay*1000, 400));
        if (stopRequested) return;
        showTyping();
        await sleep(Math.max(delay*1000*0.6, 500));
        hideTyping();
      } else if (msg.type !== 'system') {
        await sleep(delay*1000*0.5);
      } else {
        await sleep(200);
      }
      if (stopRequested) return;

      appendDayDivider(msg.ts);
      if (msg.type === 'system') appendSystem(msg);
      else appendMessage(msg);

      idx++;
      updateProgress();
    }
    playing = false;
    document.getElementById('playBtn').textContent = '▶ Play';
    document.getElementById('headerStatus').textContent = 'online';
  }

  function updateProgress(){
    const total = chatData.messages.length;
    const pct = total ? Math.round((idx/total)*100) : 0;
    document.getElementById('progressBar').style.width = pct+'%';
    document.getElementById('progressLabel').textContent = idx+' / '+total+' messages';
  }

  /* ================= CONTROLS ================= */
  function resetPlayback(){
    stopRequested = true;
    playing = false;
    idx = 0;
    lastDateKey = null;
    pendingSentTicks = [];
    hideTyping();
    chatBody.innerHTML = '';
    document.getElementById('playBtn').textContent = '▶ Play';
    updateProgress();
    if (!chatData.messages.length){
      chatBody.appendChild(emptyState);
    }
  }

  function setupHeader(){
    const other = chatData.participants.find(p=>p!==meName) || chatData.participants[0] || 'Contact';
    document.getElementById('headerName').textContent = other;
    document.getElementById('headerStatus').textContent = 'online';
    const av = document.getElementById('avatar');
    av.textContent = initials(other);
    av.style.background = colorFor(other);
  }

  function setupMeSelect(){
    const sel = document.getElementById('meSelect');
    sel.innerHTML = '';
    chatData.participants.forEach(p=>{
      const opt = document.createElement('option');
      opt.value = p; opt.textContent = p;
      sel.appendChild(opt);
    });
    if (chatData.participants.length){
      meName = chatData.participants[0];
      sel.value = meName;
    }
  }

  function loadChat(rawText, label){
    chatData = parseChat(rawText);
    setupMeSelect();
    setupHeader();
    resetPlayback();
    document.getElementById('fileName').textContent = 'Using: ' + label;
  }

  document.getElementById('meSelect').addEventListener('change', e=>{
    meName = e.target.value;
    setupHeader();
    resetPlayback();
  });

  document.getElementById('fileInput').addEventListener('change', e=>{
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => loadChat(ev.target.result, file.name);
    reader.readAsText(file);
  });

  document.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      speedMode = chip.dataset.mode;
      if (speedMode === 'fixed'){
        fixedSeconds = parseFloat(chip.dataset.val);
        document.getElementById('customSlider').value = fixedSeconds;
        document.getElementById('customVal').textContent = fixedSeconds.toFixed(1)+'s';
      }
    });
  });

  document.getElementById('customSlider').addEventListener('input', e=>{
    fixedSeconds = parseFloat(e.target.value);
    speedMode = 'fixed';
    document.getElementById('customVal').textContent = fixedSeconds.toFixed(1)+'s';
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  });

  document.getElementById('playBtn').addEventListener('click', ()=>{
    ensureAudio();
    if (!chatData.messages.length) return;
    if (playing){
      playing = false;
      document.getElementById('playBtn').textContent = '▶ Play';
      hideTyping();
    } else {
      playing = true;
      document.getElementById('playBtn').textContent = '⏸ Pause';
      if (idx === 0) { chatBody.innerHTML=''; }
      playLoop();
    }
  });

  document.getElementById('restartBtn').addEventListener('click', ()=>{
    ensureAudio();
    resetPlayback();
  });

  document.getElementById('skipBtn').addEventListener('click', ()=>{
    stopRequested = true;
    playing = false;
    document.getElementById('playBtn').textContent = '▶ Play';
    hideTyping();
    chatBody.innerHTML = '';
    lastDateKey = null;
    pendingSentTicks = [];
    chatData.messages.forEach(msg=>{
      appendDayDivider(msg.ts);
      if (msg.type === 'system') appendSystem(msg);
      else appendMessage(msg);
    });
    idx = chatData.messages.length;
    updateProgress();
    scrollToBottom();
  });

  // live clock in fake status bar
  function tickClock(){
    document.getElementById('clock').textContent = fmtTime(new Date());
  }
  tickClock(); setInterval(tickClock, 30000);

  /* ================= INIT WITH DEMO DATA ================= */
  const embedded = JSON.parse(document.getElementById('embeddedChat').textContent);
  loadChat(embedded, 'WhatsApp_Chat_with_Sonia_Bhabhi.txt (demo)');

})();
</script>

</body>
</html>
